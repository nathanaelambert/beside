name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep main deployments in order; cancel superseded checks only for PRs.
concurrency:
  group: ci-and-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Type checks, tests, and PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: beside_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beside_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/beside_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/beside_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types and playground lint
        run: |
          pnpm --filter @beside/domain check-types
          pnpm --filter @beside/api-client check-types
          pnpm --filter @beside/api check-types
          pnpm --filter playground check-types
          pnpm --filter mobile check-types
          pnpm --filter playground lint
      - name: Migrate the disposable CI database
        run: pnpm --filter @beside/api db:migrate
      - name: Run tests
        run: |
          pnpm --filter @beside/api test
          pnpm --filter @beside/api-client test
          pnpm --filter playground test
      - name: Check production builds for pull requests
        if: github.event_name == 'pull_request'
        run: pnpm exec turbo run build --filter=@beside/api --filter=playground

  deploy:
    name: Deploy ${{ matrix.app }}
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            project_id: ${{ vars.VERCEL_API_PROJECT_ID }}
            production_url: https://beside-api.vercel.app
          - app: playground
            project_id: ${{ vars.VERCEL_PLAYGROUND_PROJECT_ID }}
            production_url: https://beside-playground.vercel.app
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ matrix.project_id }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check deployment configuration
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo "::error::Configure the VERCEL_TOKEN repository secret and VERCEL_ORG_ID / project ID repository variables. See .github/README.md."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - name: Install dependencies and Vercel CLI
        run: |
          pnpm install --frozen-lockfile
          npm install --global vercel@65.4.0
      - name: Pull production project settings and environment
        run: vercel pull --yes --environment=production --scope=mosaab-emams-projects --token="$VERCEL_TOKEN"
      - name: Build the production artifact
        run: vercel build --prod --yes --scope=mosaab-emams-projects --token="$VERCEL_TOKEN"
      - name: Apply API database migrations
        if: matrix.app == 'api'
        run: node --env-file=.vercel/.env.production.local --conditions=source --experimental-strip-types apps/api/scripts/migrate.ts
      - name: Deploy the built artifact
        run: vercel deploy --prebuilt --prod --yes --scope=mosaab-emams-projects --token="$VERCEL_TOKEN"
      - name: Verify the production deployment
        env:
          APP: ${{ matrix.app }}
          PRODUCTION_URL: ${{ matrix.production_url }}
        run: |
          node .github/scripts/verify-deployment.mjs "$APP" "$PRODUCTION_URL"
          printf '### %s production deployment\n\n%s\n' "$APP" "$PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"
