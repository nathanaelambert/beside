services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: beside
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - beside-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beside"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  beside-postgres:
